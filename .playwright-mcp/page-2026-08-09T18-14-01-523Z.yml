      - generic [ref=e45]:
        - paragraph [ref=e46]: Nosotros
        - heading "Diseñamos y construimos con metodología BIM." [level=2] [ref=e47]
        - generic [ref=e48]:
          - paragraph [ref=e49]: "Somos un estudio de arquitectura y construcción en Tulancingo, Hidalgo, con cuatro años acompañando a familias y desarrolladores en proyectos residenciales y comerciales. Trabajamos diseño y obra bajo el mismo techo: una sola visión, una sola responsabilidad."
          - paragraph [ref=e50]: La diferencia está en cómo lo hacemos. Modelamos cada proyecto en BIM antes de levantar un muro, así puedes recorrer tu casa o local en renders y maquetas digitales, revisar los planos por planta y entender el costo antes de empezar. Lo que ves en pantalla es lo que vas a recibir en obra.
          - paragraph [ref=e51]: "Operamos en Tulancingo y el centro de Hidalgo: Mineral de la Reforma, Pachuca, Cuautepec, Singuilucan y municipios vecinos. Si tu terreno está en la región, hablamos el mismo idioma técnico y el mismo calendario."
        - paragraph [ref=e52]: "\"Cuatro años construyendo con la precisión que tu proyecto merece.\""
