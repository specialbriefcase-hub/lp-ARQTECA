          - heading "Diseño arquitectónico" [level=3] [ref=f1e114]
          - paragraph [ref=f1e115]: Proyectos residenciales y comerciales con metodología BIM. Bocetos, anteproyecto y ejecutivo en un mismo modelo.
        - listitem [ref=f1e116]:
          - heading "Construcción" [level=3] [ref=f1e120]
          - paragraph [ref=f1e121]: Ejecución de obra con supervisión técnica constante. Cronograma, costos y calidad bajo control semanal.
        - listitem [ref=f1e122]:
          - heading "Modelado BIM" [level=3] [ref=f1e126]
          - paragraph [ref=f1e127]: Maquetas digitales, planos 2D y renders fotorrealistas. Visualiza el resultado antes de construir.
        - listitem [ref=f1e128]:
          - heading "Asesoría" [level=3] [ref=f1e132]
          - paragraph [ref=f1e133]: Consultoría para clientes que desarrollan por su cuenta. Revisamos planos, presupuestos y contratistas.
