      - generic [ref=f1e95]:
        - paragraph [ref=f1e96]: Nosotros
        - heading "Diseñamos y construimos con metodología BIM." [level=2] [ref=f1e97]
        - generic [ref=f1e98]:
          - paragraph [ref=f1e99]: "Somos un estudio de arquitectura y construcción en Tulancingo, Hidalgo, con cuatro años acompañando a familias y desarrolladores en proyectos residenciales y comerciales. Trabajamos diseño y obra bajo el mismo techo: una sola visión, una sola responsabilidad."
          - paragraph [ref=f1e100]: La diferencia está en cómo lo hacemos. Modelamos cada proyecto en BIM antes de levantar un muro, así puedes recorrer tu casa o local en renders y maquetas digitales, revisar los planos por planta y entender el costo antes de empezar. Lo que ves en pantalla es lo que vas a recibir en obra.
          - paragraph [ref=f1e101]: "Operamos en Tulancingo y el centro de Hidalgo: Mineral de la Reforma, Pachuca, Cuautepec, Singuilucan y municipios vecinos. Si tu terreno está en la región, hablamos el mismo idioma técnico y el mismo calendario."
        - paragraph [ref=f1e102]: "\"Cuatro años construyendo con la precisión que tu proyecto merece.\""
    - generic [ref=f1e104]:
      - generic [ref=f1e105]:
