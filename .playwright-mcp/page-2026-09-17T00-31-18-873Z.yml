          - paragraph [ref=f2e105]: Proyectos residenciales y comerciales con metodología BIM. Bocetos, anteproyecto y ejecutivo en un mismo modelo.
        - listitem [ref=f2e106]:
          - heading "Construcción" [level=3] [ref=f2e110]
          - paragraph [ref=f2e111]: Ejecución de obra con supervisión técnica constante. Cronograma, costos y calidad bajo control semanal.
