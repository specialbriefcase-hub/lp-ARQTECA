        - paragraph [ref=f2e86]: Nosotros
        - heading "Diseñamos y construimos con metodología BIM." [level=2] [ref=f2e87]
        - generic [ref=f2e88]:
          - paragraph [ref=f2e89]: "Somos un estudio de arquitectura y construcción en Tulancingo, Hidalgo, con cuatro años acompañando a familias y desarrolladores en proyectos residenciales y comerciales. Trabajamos diseño y obra bajo el mismo techo: una sola visión, una sola responsabilidad."
          - paragraph [ref=f2e90]: La diferencia está en cómo lo hacemos. Modelamos cada proyecto en BIM antes de levantar un muro, así puedes recorrer tu casa o local en renders y maquetas digitales, revisar los planos por planta y entender el costo antes de empezar. Lo que ves en pantalla es lo que vas a recibir en obra.
          - paragraph [ref=f2e91]: "Operamos en Tulancingo y el centro de Hidalgo: Mineral de la Reforma, Pachuca, Cuautepec, Singuilucan y municipios vecinos. Si tu terreno está en la región, hablamos el mismo idioma técnico y el mismo calendario."
        - paragraph [ref=f2e92]: "\"Cuatro años construyendo con la precisión que tu proyecto merece.\""
